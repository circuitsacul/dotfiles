%YAML 1.3
---
- Rule:
  - Test: [hires_wheel_down, 1]
  - Rule:
    - KeyIsDown: Mouse Gesture Button
    - KeyPress:
      - XF86_AudioLowerVolume
      - click
  - Rule:
    - Not:
        KeyIsDown: Mouse Gesture Button
    - MouseScroll: [0, 1]
- Rule:
  - Test: [hires_wheel_up, 1]
  - Rule:
    - KeyIsDown: Mouse Gesture Button
    - KeyPress:
      - XF86_AudioRaiseVolume
      - click
  - Rule:
    - Not:
        KeyIsDown: Mouse Gesture Button
    - MouseScroll: [0, -1]
...
---
- Rule:
  - Key: [Haptic, pressed]
  - KeyPress:
    - [Control_L, space]
    - click
...
---
- Rule:
  - MouseGesture: Mouse Left
  - Execute:
    - /usr/bin/busctl
    - --user
    - call
    - org.kde.kglobalaccel
    - /component/kwin
    - org.kde.kglobalaccel.Component
    - invokeShortcut
    - s
    - Switch One Desktop to the Right
- Rule:
  - MouseGesture: Mouse Right
  - Execute:
    - /usr/bin/busctl
    - --user
    - call
    - org.kde.kglobalaccel
    - /component/kwin
    - org.kde.kglobalaccel.Component
    - invokeShortcut
    - s
    - Switch One Desktop to the Left
- Rule:
  - MouseGesture: Mouse Down
  - KeyPress:
    - [Control_L, Alt_L, g]
    - click
- Rule:
  - MouseGesture: Mouse Up
  - KeyPress:
    - [Control_L, Alt_L, w]
    - click
...
