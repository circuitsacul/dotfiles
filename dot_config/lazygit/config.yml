git:
  diffRenderers:
    - command: 'difft'
      type: extDiff
os:
  open: '~/bin/yhx-switch-hx {{filename}}'
  edit: '~/bin/yhx-switch-hx {{filename}}'
  editAtLine: '~/bin/yhx-switch-hx --line={{line}} {{filename}}'
  editInTerminal: false
keybinding:
  status:
    openConfigFile: ''
    editConfigFile: ''
  universal:
    prevBlock-alt: 'n'
    nextBlock-alt: 'o'
    nextItem-alt: 'e'
    prevItem-alt: 'i'
    edit: 'h'
    openFile: 'H'
    new: 'c'
  branches:
    createPullRequest: 'b'
  commits:
    openInBrowser: 'b'
customCommands:
  - key: "E"
    context: "global"
    description: "switch to helix"
    command: "~/bin/yhx-switch-hx"
  - key: "Y"
    context: "global"
    description: "switch to yazi"
    command: "~/bin/yhx-switch-yazi"
  - key: "w"
    context: "files"
    description: "WIP commit (no signing, no hooks)"
    command: 'git commit --no-gpg-sign --no-verify -m "wip"'
    loadingText: "Committing WIP"
