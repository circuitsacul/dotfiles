git:
  pagers:
    - externalDiffCommand: 'difft'
os:
  open: '~/.config/yazi/open-in-hx.sh {{filename}}'
  edit: '~/.config/yazi/open-in-hx.sh {{filename}}'
  editAtLine: '~/.config/yazi/open-in-hx.sh --line={{line}} {{filename}}'
  editInTerminal: false
keybinding:
  status:
    openConfigFile: ''
    editConfigFile: ''
  universal:
    prevBlock-alt: 'n'
    nextBlock-alt: 'o'
    nextItem-alt: 'e'
    prevItem-alt: 'i'
    edit: 'h'
    openFile: 'H'
    new: 'c'
  branches:
    createPullRequest: 'b'
  commits:
    openInBrowser: 'b'
customCommands:
  - key: "E"
    context: "global"
    description: "switch to helix"
    command: "~/.config/yazi/open-in-hx.sh"
  - key: "Y"
    context: "global"
    description: "switch to yazi"
    command: "~/.config/yazi/switch-to-yazi.sh"
