theme = "catppuccin_mocha"

[editor]
scroll-lines = 3

line-number = "relative"
bufferline = "always"

completion-trigger-len = 1
completion-timeout = 5

rulers = [101]

[editor.soft-wrap]
enable = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.lsp]
display-messages = true

[editor.indent-guides]
render = false
character = "▏"

[editor.file-picker]
hidden = false

###################################################################################################
# YHX scripts
# Helix can't shell-escape expansions yet (helix#14149 would add %quote{}). Single quotes
# cover most names, but a name with a ' can break out of them; accepted, since opening an
# untrusted repo in helix is already unsafe.
[keys.normal.space]
e = ":run-shell-command ~/bin/yhx-switch tree '%{buffer_name}'"
E = ":run-shell-command ~/bin/yhx-switch tree"
l = ":run-shell-command ~/bin/yhx-switch lazygit"

###################################################################################################
# colemak-dh key mappings
[keys.normal]
N = "goto_previous_buffer"
O = "goto_next_buffer"

n="move_char_left"
e="move_visual_line_down"
i="move_visual_line_up"
o="move_char_right"

h="insert_mode"
H="insert_at_line_start"

l="open_below"
L="open_above"

k="move_next_word_end"
K="move_next_long_word_end"

j="search_next"
J="search_prev"

E="join_selections"
"A-E"="join_selections_space"

I="keep_selections"
"A-I"="remove_selections"

# Hide redundant stock aliases; use Alt+E / Alt+I.
"A-J"="no_op"
"A-K"="no_op"

[keys.normal.g]
G="goto_last_line"
I="goto_implementation"

n="goto_line_start"
o="goto_line_end"

e="move_line_down"
i="move_line_up"

# Hide stock direction aliases; use n/e/i/o.
h="no_op"
j="no_op"
k="no_op"
l="no_op"
# Hide the stock previous-buffer alias (its partner g n is line start here); use N/O.
p="no_op"

[keys.normal.space.w]
n="jump_view_left"
e="jump_view_down"
i="jump_view_up"
o="jump_view_right"
l="wonly"
"C-l"="wonly"
N="swap_view_left"
E="swap_view_down"
I="swap_view_up"
O="swap_view_right"
h = { s = "hsplit_new", v = "vsplit_new", C-s = "hsplit_new", C-v = "vsplit_new" }

# Hide stock direction/swap aliases; use neio/NEIO.
j="no_op"
k="no_op"
H="no_op"
J="no_op"
K="no_op"
L="no_op"
"C-h"="no_op"
"C-j"="no_op"
"C-k"="no_op"
