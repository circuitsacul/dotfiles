      model: fireworks_ai/accounts/fireworks/models/glm-5p2
      api_key: os.environ/FIREWORKS_AI_API_KEY
      # additional_drop_params: ["web_search_options", "client_metadata", "tool_choice"]
      # drop_params: true
    model_info:
      supports_function_calling: true
